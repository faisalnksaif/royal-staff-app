<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale stops iOS zooming the page when a small input is focused -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!--
      PWA shell. This file is Expo's template for the single-page web build
      (web.output "single"); src/app/+html.tsx is ignored in that mode, so the
      tags must live here or they never reach production.
    -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Makes the iOS home-screen icon open as a standalone app with its own persistent storage -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque bar: screens don't pad for safe-area insets, so a translucent bar would cover headers -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="RoyalPulse" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #000000;
        /* No grey flash on tap, no rubber-band pull-to-refresh in the standalone app */
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function (err) {
            console.warn("[SW] registration failed:", err)
          })
        })
      }
      // Ask the browser not to evict our storage (the login lives in localStorage).
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () {})
      }
    </script>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
